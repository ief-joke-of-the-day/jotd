name: Daily joke

on:
  schedule:
    # 22:30 and 23:30 UTC = 00:30 Europe/Zurich in summer/winter respectively.
    # The script is idempotent per Zurich date, so the second run is a no-op.
    - cron: "30 22 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-joke
  cancel-in-progress: false

jobs:
  joke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch joke
        run: python fetch_joke.py
      - name: Commit if changed
        run: |
          git config user.name "joke-bot"
          git config user.email "joke-bot@users.noreply.github.com"
          git add joke.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Joke for $(date -u +%F)"
            git push
          fi
