<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joke of the Day</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css">
  <style>
    :root {
      --cm: "Computer Modern Serif", "Latin Modern Roman", "CMU Serif", Georgia, "Times New Roman", serif;
      --ink: #111;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #525659;
      font-family: var(--cm);
      color: var(--ink);
      padding: 1.25rem .6rem 3rem;
    }
    .page {
      max-width: 48rem;
      aspect-ratio: 210 / 297;
      margin: 0 auto;
      background: #fff;
      padding: clamp(1.2rem, 3.5vw, 2.2rem) clamp(1.1rem, 4.5vw, 3.4rem) clamp(1rem, 2.5vw, 1.6rem);
      box-shadow: 0 2px 14px rgba(0,0,0,.45);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .date-line {
      text-align: right;
      font-size: clamp(.65rem, 1.6vw, .78rem);
      color: #666;
      margin-bottom: clamp(.7rem, 2.2vw, 1.4rem);
    }

    /* THE JOKE as the paper title */
    h1#joke {
      font-weight: 700;
      text-align: center;
      font-size: clamp(1.2rem, 4.4vw, 2.45rem);
      line-height: 1.18;
      margin: 0 0 clamp(.7rem, 2vw, 1.25rem);
      overflow-wrap: break-word;
    }
    h1#joke .punch {
      display: block;
      margin-top: .32em;
      font-weight: 400;
      font-style: italic;
      font-size: .85em;
    }

    /* Only two bar types: thick black (authors & section titles) and thin grey (everything else) */
    .b {
      display: block;
      height: clamp(.32rem, .85vw, .52rem);
      background: #111;
      border-radius: 1px;
    }
    .b.thin {
      height: clamp(.2rem, .5vw, .32rem);
      background: #777;
    }

    /* Author rows */
    .authors {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(.25rem, .7vw, .42rem);
      margin-bottom: clamp(.9rem, 2.8vw, 1.8rem);
    }
    .authors .row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: .35rem .7rem;
      width: 100%;
    }

    /* Two-column paper body */
    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(.8rem, 2.8vw, 2rem);
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .col {
      display: flex;
      flex-direction: column;
      gap: clamp(.32rem, .85vw, .58rem);
    }
    .lines {
      display: flex;
      flex-direction: column;
      gap: clamp(.14rem, .38vw, .24rem);
    }
    .hd { margin-top: clamp(.15rem, .4vw, .3rem); margin-bottom: clamp(.18rem, .45vw, .32rem); }

    /* Abstract in left column */
    .abstract {
      padding: clamp(.25rem, .7vw, .45rem) 0;
      border-top: 1px solid #d0d0d0;
      border-bottom: 1px solid #d0d0d0;
      margin-bottom: clamp(.1rem, .3vw, .2rem);
    }
    .abstract .hd { margin-top: 0; margin-bottom: clamp(.18rem, .45vw, .3rem); }

    .folio {
      text-align: center;
      font-size: clamp(.65rem, 1.5vw, .8rem);
      color: #555;
      margin-top: clamp(.6rem, 1.8vw, 1.2rem);
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="date-line" id="date">…</div>

    <h1 id="joke">Loading…</h1>

    <!-- Authors (thick black) & affiliations (thin grey) -->
    <div class="authors" aria-hidden="true">
      <div class="row">
        <span class="b" style="width: 6rem"></span>
        <span class="b" style="width: 5.5rem"></span>
        <span class="b" style="width: 6.5rem"></span>
      </div>
      <div class="row">
        <span class="b thin" style="width: 10.5rem"></span>
        <span class="b thin" style="width: 9rem"></span>
      </div>
    </div>

    <!-- Two-column paper body (densely packed; overflows cleanly at bottom margin) -->
    <div class="cols" aria-hidden="true">
      <div class="col" id="col-left">
        <div class="abstract">
          <span class="b hd" style="width: 4.2rem"></span>
          <div class="lines">
            <span class="b thin" style="width: 100%"></span>
            <span class="b thin" style="width: 96%"></span>
            <span class="b thin" style="width: 98%"></span>
            <span class="b thin" style="width: 94%"></span>
            <span class="b thin" style="width: 72%"></span>
          </div>
        </div>
      </div>
      <div class="col" id="col-right"></div>
    </div>

    <div class="folio">1</div>
  </div>

  <script>
    // Populate dense two-column paper bars
    (() => {
      const mk = (cls, w) => {
        const s = document.createElement("span");
        s.className = cls;
        s.style.width = w;
        return s;
      };
      const addSection = (col, headingW, paras) => {
        if (headingW) col.append(mk("b hd", headingW));
        for (const widths of paras) {
          const box = document.createElement("div");
          box.className = "lines";
          for (const w of widths) box.append(mk("b thin", w));
          col.append(box);
        }
      };

      const L = document.getElementById("col-left");
      addSection(L, "52%", [
        ["100%", "96%", "100%", "93%", "98%", "64%"],
        ["100%", "95%", "99%", "92%", "100%", "78%", "45%"],
      ]);
      addSection(L, "44%", [
        ["100%", "97%", "94%", "100%", "91%", "68%"],
        ["100%", "96%", "99%", "88%", "52%"],
        ["100%", "95%", "98%", "93%", "74%"],
      ]);
      addSection(L, "56%", [
        ["100%", "94%", "99%", "96%", "60%"],
        ["100%", "97%", "92%", "84%"],
        ["100%", "95%", "98%", "90%", "54%"],
      ]);
      addSection(L, "46%", [
        ["100%", "96%", "93%", "99%", "72%"],
        ["100%", "94%", "97%", "64%"],
      ]);

      const R = document.getElementById("col-right");
      addSection(R, "48%", [
        ["100%", "95%", "100%", "93%", "97%", "70%"],
        ["100%", "98%", "94%", "100%", "89%", "56%"],
      ]);
      addSection(R, "54%", [
        ["100%", "96%", "99%", "91%", "100%", "82%", "48%"],
        ["100%", "94%", "97%", "95%", "66%"],
      ]);
      addSection(R, "42%", [
        ["100%", "97%", "93%", "99%", "62%"],
        ["100%", "95%", "98%", "86%"],
      ]);
      addSection(R, "38%", [
        ["96%", "78%", "94%", "64%", "98%", "72%", "90%", "58%"],
        ["95%", "82%", "97%", "68%", "91%", "52%"],
      ]);
    })();

    const FALLBACK = "Why did the paper not load? It was still under review.";
    const zurichToday = () => new Intl.DateTimeFormat("en-CA", {
      timeZone: "Europe/Zurich", year: "numeric", month: "2-digit", day: "2-digit"
    }).format(new Date());
    const fmt = dateStr => new Date(dateStr + "T12:00:00").toLocaleDateString("en-GB", {
      day: "numeric", month: "long", year: "numeric"
    });

    function dateSeed(dateStr) {
      let h = 0x811c9dc5;
      for (let i = 0; i < dateStr.length; i++) {
        h = Math.imul(h ^ dateStr.charCodeAt(i), 0x01000193) >>> 0;
      }
      return h;
    }

    function render(joke, dateStr) {
      const h = document.getElementById("joke");
      h.textContent = "";
      const i = joke.indexOf("? ");
      if (i > 0 && i < joke.length - 2) {
        h.append(joke.slice(0, i + 1));
        const p = document.createElement("span");
        p.className = "punch";
        p.textContent = joke.slice(i + 2);
        h.append(p);
      } else {
        h.textContent = joke;
      }
      document.getElementById("date").textContent = fmt(dateStr);
    }

    async function fetchJokeForDate(dateStr) {
      const hdrs = { Accept: "application/json" };
      const r1 = await fetch("https://icanhazdadjoke.com/search?limit=1&page=1", { headers: hdrs });
      if (!r1.ok) throw new Error(r1.status);
      const m = await r1.json();
      const page = (dateSeed(dateStr) % m.total_jokes) + 1;
      if (page === 1 && m.results?.[0]?.joke) return m.results[0].joke;
      const r2 = await fetch(`https://icanhazdadjoke.com/search?limit=1&page=${page}`, { headers: hdrs });
      if (!r2.ok) throw new Error(r2.status);
      const d2 = await r2.json();
      return d2.results[0].joke;
    }

    (async () => {
      const today = zurichToday();
      try {
        const r = await fetch("joke.json?_=" + Date.now(), { cache: "no-store" });
        if (r.ok) {
          const d = await r.json();
          if (d.date === today && d.joke) { render(d.joke, today); return; }
        }
      } catch {}
      try {
        render(await fetchJokeForDate(today), today);
      } catch {
        try {
          const fb = await fetch("fallback_jokes.json").then(r => r.json());
          render(fb[dateSeed(today) % fb.length], today);
        } catch {
          render(FALLBACK, today);
        }
      }
    })();
  </script>
</body>
</html>
