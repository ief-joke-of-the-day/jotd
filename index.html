<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joke of the Day</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css">
  <style>
    :root {
      --cm: "Computer Modern Serif", "Latin Modern Roman", "CMU Serif", Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #525659;
      font-family: var(--cm);
      color: #111;
      padding: clamp(.6rem, 2vw, 1.5rem) .6rem 2.5rem;
    }
    .page {
      width: 100%;
      max-width: 48rem;
      aspect-ratio: 210 / 297;
      margin: 0 auto;
      background: #fff;
      padding: clamp(1.2rem, 5.5%, 2.8rem) clamp(1.1rem, 6.5%, 3.2rem);
      box-shadow: 0 2px 14px rgba(0,0,0,.45);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* THE JOKE: the only real text on the page */
    h1#joke {
      font-weight: 700;
      text-align: center;
      font-size: clamp(1.05rem, 3.6vw, 2.2rem);
      line-height: 1.2;
      margin: 0 0 clamp(.5rem, 1.6vw, 1.1rem);
      overflow-wrap: break-word;
    }
    h1#joke .punch {
      display: block;
      margin-top: .28em;
      font-weight: 400;
      font-style: italic;
      font-size: .86em;
    }

    /* Two bar types only: thick black (authors & section titles) and thinner grey (text) */
    .b {
      display: block;
      flex-shrink: 0;
      height: clamp(.38rem, 1vw, .62rem);
      background: #111;
      border-radius: 1px;
    }
    .b.thin {
      height: clamp(.20rem, .54vw, .34rem);
      background: #888;
    }

    /* Author rows */
    .authors {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(.25rem, .65vw, .42rem);
      margin-bottom: clamp(.85rem, 2.8vw, 1.75rem);
    }
    .authors .row {
      display: flex;
      justify-content: center;
      gap: clamp(.35rem, 1vw, .7rem);
      width: 100%;
    }

    /* Two full-width columns from under authors to bottom of A4 */
    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: start;
      gap: clamp(.85rem, 3vw, 2rem);
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .col {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .lines {
      display: flex;
      flex-direction: column;
      gap: clamp(.20rem, .54vw, .34rem);
    }
    .sec-title {
      margin-bottom: clamp(.32rem, .85vw, .55rem);
    }
    .after-abstract {
      margin-bottom: clamp(.85rem, 2.4vw, 1.55rem);
    }
    .before-sec3 {
      margin-top: clamp(.85rem, 2.4vw, 1.55rem);
    }
  </style>
</head>
<body>
  <div class="page">
    <h1 id="joke">Loading…</h1>

    <!-- Authors (thick black) & affiliations (grey) -->
    <div class="authors" aria-hidden="true">
      <div class="row">
        <span class="b" style="width: 16%"></span>
        <span class="b" style="width: 14%"></span>
        <span class="b" style="width: 17%"></span>
      </div>
      <div class="row">
        <span class="b thin" style="width: 26%"></span>
        <span class="b thin" style="width: 22%"></span>
      </div>
    </div>

    <!-- Two columns filled top-to-bottom with exactly 3 sections -->
    <div class="cols" id="cols" aria-hidden="true">
      <div class="col" id="col-left"></div>
      <div class="col" id="col-right"></div>
    </div>
  </div>

  <script>
    const FALLBACK = "Why did the paper not load? It was still under review.";
    const zurichToday = () => new Intl.DateTimeFormat("en-CA", {
      timeZone: "Europe/Zurich", year: "numeric", month: "2-digit", day: "2-digit"
    }).format(new Date());

    function dateSeed(dateStr) {
      let h = 0x811c9dc5;
      for (let i = 0; i < dateStr.length; i++) {
        h = Math.imul(h ^ dateStr.charCodeAt(i), 0x01000193) >>> 0;
      }
      return h;
    }

    const mk = (cls, w) => {
      const s = document.createElement("span");
      s.className = cls;
      s.style.width = w;
      return s;
    };

    function fillColumns() {
      const cols = document.getElementById("cols");
      const L = document.getElementById("col-left");
      const R = document.getElementById("col-right");
      const H = cols.clientHeight;
      if (H <= 0) return;

      L.innerHTML = "";
      R.innerHTML = "";

      // Section 1: Abstract (left column top, with a little distance to Section 2)
      L.append(mk("b sec-title", "32%"));
      const absLines = document.createElement("div");
      absLines.className = "lines after-abstract";
      for (const w of ["100%", "100%", "100%", "100%", "68%"]) {
        absLines.append(mk("b thin", w));
      }
      L.append(absLines);

      // Section 2: Title directly after Abstract, full-width lines down to bottom of left column
      L.append(mk("b sec-title", "54%"));
      const sec2Left = document.createElement("div");
      sec2Left.className = "lines";
      L.append(sec2Left);
      while (true) {
        const line = mk("b thin", "100%");
        sec2Left.append(line);
        if (L.offsetHeight > H) {
          line.remove();
          break;
        }
      }

      // Right column top: continuation of Section 2, ending partway down with an early last line
      const sec2Right = document.createElement("div");
      sec2Right.className = "lines";
      R.append(sec2Right);
      const sec3Start = H * 0.36;
      while (R.offsetHeight < sec3Start) {
        sec2Right.append(mk("b thin", "100%"));
      }
      if (sec2Right.lastElementChild) {
        sec2Right.lastElementChild.style.width = "64%";
      }

      // Section 3: Somewhere in second column, full-width lines down to bottom, early last line
      R.append(mk("b sec-title before-sec3", "46%"));
      const sec3 = document.createElement("div");
      sec3.className = "lines";
      R.append(sec3);
      while (true) {
        const line = mk("b thin", "100%");
        sec3.append(line);
        if (R.offsetHeight > H) {
          line.remove();
          break;
        }
      }
      if (sec3.lastElementChild) {
        sec3.lastElementChild.style.width = "58%";
      }
    }

    function render(joke) {
      const h = document.getElementById("joke");
      h.textContent = "";
      const i = joke.indexOf("? ");
      if (i > 0 && i < joke.length - 2) {
        h.append(joke.slice(0, i + 1));
        const p = document.createElement("span");
        p.className = "punch";
        p.textContent = joke.slice(i + 2);
        h.append(p);
      } else {
        h.textContent = joke;
      }
      requestAnimationFrame(fillColumns);
    }

    async function fetchJokeForDate(dateStr) {
      const hdrs = { Accept: "application/json" };
      const r1 = await fetch("https://icanhazdadjoke.com/search?limit=1&page=1", { headers: hdrs });
      if (!r1.ok) throw new Error(r1.status);
      const m = await r1.json();
      const page = (dateSeed(dateStr) % m.total_jokes) + 1;
      if (page === 1 && m.results?.[0]?.joke) return m.results[0].joke;
      const r2 = await fetch(`https://icanhazdadjoke.com/search?limit=1&page=${page}`, { headers: hdrs });
      if (!r2.ok) throw new Error(r2.status);
      const d2 = await r2.json();
      return d2.results[0].joke;
    }

    window.addEventListener("resize", fillColumns);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fillColumns);
    }

    (async () => {
      const today = zurichToday();
      try {
        const r = await fetch("joke.json?_=" + Date.now(), { cache: "no-store" });
        if (r.ok) {
          const d = await r.json();
          if (d.date === today && d.joke) { render(d.joke); return; }
        }
      } catch {}
      try {
        render(await fetchJokeForDate(today));
      } catch {
        try {
          const fb = await fetch("fallback_jokes.json").then(r => r.json());
          render(fb[dateSeed(today) % fb.length]);
        } catch {
          render(FALLBACK);
        }
      }
    })();
  </script>
</body>
</html>
