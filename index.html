<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joke of the Day</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css">
  <style>
    :root {
      --cm: "Computer Modern Serif", "Latin Modern Roman", "CMU Serif", Georgia, "Times New Roman", serif;
      --ink: #111;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #525659;
      font-family: var(--cm);
      color: var(--ink);
      padding: 1.25rem .6rem 3rem;
    }
    .page {
      max-width: 48rem;
      aspect-ratio: 210 / 297;
      margin: 0 auto;
      background: #fff;
      padding: 2.2rem clamp(1.2rem, 5vw, 3.6rem) 1.8rem;
      box-shadow: 0 2px 14px rgba(0,0,0,.45);
      display: flex;
      flex-direction: column;
    }

    .date-line {
      text-align: right;
      font-size: .78rem;
      color: #666;
      margin-bottom: 1.6rem;
    }

    /* THE JOKE as the paper title */
    h1#joke {
      font-weight: 700;
      text-align: center;
      font-size: clamp(1.55rem, 4.8vw, 2.55rem);
      line-height: 1.18;
      margin: 0 0 1.4rem;
      overflow-wrap: break-word;
    }
    h1#joke .punch {
      display: block;
      margin-top: .35em;
      font-weight: 400;
      font-style: italic;
      font-size: .85em;
    }

    /* Only two bar types: thick black (authors & section titles) and thin grey (everything else) */
    .b {
      display: block;
      height: .55rem;
      background: #111;
      border-radius: 1px;
    }
    .b.thin {
      height: .34rem;
      background: #777;
    }

    /* Author rows */
    .authors {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .45rem;
      margin-bottom: 2.2rem;
    }
    .authors .row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: .4rem .75rem;
      width: 100%;
    }

    /* Two-column paper body */
    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.4rem clamp(1.1rem, 4vw, 2.4rem);
      flex: 1;
    }
    .col {
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }
    .lines {
      display: flex;
      flex-direction: column;
      gap: .42rem;
    }
    .hd { margin-bottom: .55rem; }

    /* Abstract in left column */
    .abstract {
      padding: .65rem 0;
      border-top: 1px solid #d0d0d0;
      border-bottom: 1px solid #d0d0d0;
    }
    .abstract .hd { margin-bottom: .5rem; }

    .folio {
      text-align: center;
      font-size: .8rem;
      color: #555;
      margin-top: 1.6rem;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="date-line" id="date">…</div>

    <h1 id="joke">Loading…</h1>

    <!-- Authors (thick black) & affiliations (thin grey) -->
    <div class="authors" aria-hidden="true">
      <div class="row">
        <span class="b" style="width: 6rem"></span>
        <span class="b" style="width: 5.5rem"></span>
        <span class="b" style="width: 6.5rem"></span>
      </div>
      <div class="row">
        <span class="b thin" style="width: 10.5rem"></span>
        <span class="b thin" style="width: 9rem"></span>
      </div>
    </div>

    <!-- Two-column paper body -->
    <div class="cols" aria-hidden="true">
      <div class="col">
        <!-- Abstract in left column -->
        <div class="abstract">
          <span class="b hd" style="width: 4.2rem"></span>
          <div class="lines">
            <span class="b thin" style="width: 100%"></span>
            <span class="b thin" style="width: 96%"></span>
            <span class="b thin" style="width: 98%"></span>
            <span class="b thin" style="width: 72%"></span>
          </div>
        </div>

        <div>
          <span class="b hd" style="width: 55%"></span>
          <div class="lines">
            <span class="b thin" style="width: 100%"></span>
            <span class="b thin" style="width: 95%"></span>
            <span class="b thin" style="width: 100%"></span>
            <span class="b thin" style="width: 92%"></span>
            <span class="b thin" style="width: 68%"></span>
          </div>
        </div>

        <div class="lines">
          <span class="b thin" style="width: 100%"></span>
          <span class="b thin" style="width: 97%"></span>
          <span class="b thin" style="width: 94%"></span>
          <span class="b thin" style="width: 54%"></span>
        </div>

        <div class="lines">
          <span class="b thin" style="width: 100%"></span>
          <span class="b thin" style="width: 91%"></span>
          <span class="b thin" style="width: 76%"></span>
        </div>
      </div>

      <div class="col">
        <div>
          <span class="b hd" style="width: 50%"></span>
          <div class="lines">
            <span class="b thin" style="width: 100%"></span>
            <span class="b thin" style="width: 96%"></span>
            <span class="b thin" style="width: 100%"></span>
            <span class="b thin" style="width: 88%"></span>
          </div>
        </div>

        <div class="lines">
          <span class="b thin" style="width: 100%"></span>
          <span class="b thin" style="width: 94%"></span>
          <span class="b thin" style="width: 100%"></span>
          <span class="b thin" style="width: 97%"></span>
          <span class="b thin" style="width: 60%"></span>
        </div>

        <div>
          <span class="b hd" style="width: 45%"></span>
          <div class="lines">
            <span class="b thin" style="width: 95%"></span>
            <span class="b thin" style="width: 82%"></span>
            <span class="b thin" style="width: 90%"></span>
            <span class="b thin" style="width: 70%"></span>
          </div>
        </div>

        <div class="lines">
          <span class="b thin" style="width: 100%"></span>
          <span class="b thin" style="width: 88%"></span>
          <span class="b thin" style="width: 52%"></span>
        </div>
      </div>
    </div>

    <div class="folio">1</div>
  </div>

  <script>
    const FALLBACK = "Why did the paper not load? It was still under review.";
    const zurichToday = () => new Intl.DateTimeFormat("en-CA", {
      timeZone: "Europe/Zurich", year: "numeric", month: "2-digit", day: "2-digit"
    }).format(new Date());
    const fmt = dateStr => new Date(dateStr + "T12:00:00").toLocaleDateString("en-GB", {
      day: "numeric", month: "long", year: "numeric"
    });

    function dateSeed(dateStr) {
      let h = 0x811c9dc5;
      for (let i = 0; i < dateStr.length; i++) {
        h = Math.imul(h ^ dateStr.charCodeAt(i), 0x01000193) >>> 0;
      }
      return h;
    }

    function render(joke, dateStr) {
      const h = document.getElementById("joke");
      h.textContent = "";
      const i = joke.indexOf("? ");
      if (i > 0 && i < joke.length - 2) {
        h.append(joke.slice(0, i + 1));
        const p = document.createElement("span");
        p.className = "punch";
        p.textContent = joke.slice(i + 2);
        h.append(p);
      } else {
        h.textContent = joke;
      }
      document.getElementById("date").textContent = fmt(dateStr);
    }

    async function fetchJokeForDate(dateStr) {
      const hdrs = { Accept: "application/json" };
      const r1 = await fetch("https://icanhazdadjoke.com/search?limit=1&page=1", { headers: hdrs });
      if (!r1.ok) throw new Error(r1.status);
      const m = await r1.json();
      const page = (dateSeed(dateStr) % m.total_jokes) + 1;
      if (page === 1 && m.results?.[0]?.joke) return m.results[0].joke;
      const r2 = await fetch(`https://icanhazdadjoke.com/search?limit=1&page=${page}`, { headers: hdrs });
      if (!r2.ok) throw new Error(r2.status);
      const d2 = await r2.json();
      return d2.results[0].joke;
    }

    (async () => {
      const today = zurichToday();
      try {
        const r = await fetch("joke.json?_=" + Date.now(), { cache: "no-store" });
        if (r.ok) {
          const d = await r.json();
          if (d.date === today && d.joke) { render(d.joke, today); return; }
        }
      } catch {}
      try {
        render(await fetchJokeForDate(today), today);
      } catch {
        try {
          const fb = await fetch("fallback_jokes.json").then(r => r.json());
          render(fb[dateSeed(today) % fb.length], today);
        } catch {
          render(FALLBACK, today);
        }
      }
    })();
  </script>
</body>
</html>
